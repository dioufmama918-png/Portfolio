const ICONS = ['<path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/>','<path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>','<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>','<path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3"/>'];

let lang = (location.hash === "#en") ? "en" : "fr", cat = "all", slide = 0, timer = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

function renderSlide(){
  const t = T[lang], c = C[slide], x = c[lang];
  const n = String(slide+1).padStart(2,"0") + " / " + String(C.length).padStart(2,"0");
  $("slider").innerHTML = `<button type="button" class="slide-img zoom" data-zoom="${esc(c.img)}" data-cap="${esc(x.t)}" aria-label="${t.zoom}"><img src="${esc(c.img)}" alt="${esc(x.t)}"></button>
    <div class="slide-txt"><div class="row"><span class="cat c-${c.cat}">${esc(x.k)}</span><span class="count">${n}</span></div>
    <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
    <div class="meth"><h4>${t.meth}</h4><p>${esc(x.m)}</p></div>
    <div class="slide-nav"><button type="button" id="prev" aria-label="Précédent / Previous">←</button><button type="button" id="next" aria-label="Suivant / Next">→</button></div></div>`;
}
function go(d){ slide = (slide + d + C.length) % C.length; renderSlide(); }

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = t[e.dataset.i]);
  $("foot").textContent = "© 2026 " + NAME + ". " + t.foot;
  $("btn-fr").setAttribute("aria-pressed", lang==="fr"); $("btn-en").setAttribute("aria-pressed", lang==="en");
  $("links").innerHTML = Object.keys(t.nav).map(k => `<a href="#${k}" data-go="${k}">${t.nav[k]}</a>`).join("");
  const a = t.about;
  $("aboutGrid").innerHTML =
    `<div class="box"><h4>${a[0][0]}</h4><p>${esc(a[0][1])}</p><p class="foot-note">${esc(a[0][2])}</p></div>
     <div class="box stat"><b>${a[1][0]}</b><span>${esc(a[1][1])}</span><p>${esc(a[1][2])}</p></div>
     <div class="box"><h4>${a[2][0]}</h4><ul>${a[2][1].map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
  $("skillGrid").innerHTML = t.skills.map((s,i) =>
    `<div class="box tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</svg><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
  $("chips").innerHTML = Object.keys(t.cats).map(k => `<button type="button" data-c="${k}" aria-pressed="${k===cat}">${t.cats[k]}</button>`).join("");
  $("projGrid").innerHTML = P.filter(p => cat==="all" || p.cats.includes(cat)).map(p => {
    const x = p[lang];
    return `<article class="card"><button type="button" class="thumb zoom" data-zoom="${esc(p.img)}" data-cap="${esc(x.t)}" aria-label="${t.zoom}"><img src="${esc(p.img)}" alt="${esc(x.t)}"><span class="tag-over">${esc(x.kind)}</span></button>
      <div class="body"><div class="row"><span class="cat c-${p.cats[0]}">${t.cats[p.cats[0]]}</span><span class="when">${esc(p.when)}</span></div>
      <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p><div class="tags">${x.tags.map(s => `<span>${esc(s)}</span>`).join("")}</div></div>
      <div class="foot"><span>📍 ${esc(x.place)}</span><b>${esc(x.data)}</b>${p.link ? `<a class="lnk" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">Notebook →</a>` : ""}</div></article>`;
  }).join("");
  $("others").innerHTML = t.others.map(o => `<div class="other"><div class="row"><h4>${esc(o[0])}</h4>${o[2] ? `<span class="when">${esc(o[2])}</span>` : ""}</div><p>${esc(o[1])}</p></div>`).join("");
  $("timeline").innerHTML = t.tl.map(r => `<div class="tl"><span class="yr">${esc(r[0])}</span><h3>${esc(r[1])}</h3><p><strong>${esc(r[2])}</strong></p><p>${esc(r[3])}</p></div>`).join("");
  renderSlide();
}

function openBox(src, cap, cv){
  $("lb-img").src = src; $("lb-img").alt = cap; $("lb-cap").textContent = cap;
  $("lb-tabs").hidden = !cv; $("lightbox").classList.toggle("cv", !!cv);
  $("lightbox").hidden = false; $("lb-close").focus();
}
function closeBox(){ $("lightbox").hidden = true; $("lb-img").removeAttribute("src"); }
function showCv(v){
  document.querySelectorAll("#lb-tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cv === v));
  openBox("img/cv_" + v + ".jpg", T[lang].cvCap, true);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ e.preventDefault(); const s = $(g.dataset.go); if (s) s.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const z = e.target.closest("[data-zoom]"); if (z){ openBox(z.dataset.zoom, z.dataset.cap, false); return; }
  const v = e.target.closest("[data-cv]"); if (v){ showCv(v.dataset.cv); return; }
  if (e.target.closest("#cv-open")){ showCv("alternance"); return; }
  if (e.target.closest("#lb-close") || e.target.id === "lightbox" || e.target.classList.contains("lb-body")){ closeBox(); return; }
  const c = e.target.closest("#chips button"); if (c){ cat = c.dataset.c; render(); return; }
  if (e.target.closest("#prev")) go(-1);
  if (e.target.closest("#next")) go(1);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lightbox").hidden) closeBox(); });
$("btn-fr").onclick = () => { lang = "fr"; render(); };
$("btn-en").onclick = () => { lang = "en"; render(); };
render();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const start = () => { clearInterval(timer); timer = setInterval(() => { if ($("lightbox").hidden) go(1); }, 8000); };
  $("slider").addEventListener("mouseenter", () => clearInterval(timer));
  $("slider").addEventListener("mouseleave", start);
  start();
}
</script>

</body>
</html>
