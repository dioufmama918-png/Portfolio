<style>
:root{
  --paper:#f6f7f4; --sheet:#ffffff; --ink:#18241d; --ink2:#4d5a52; --rule:#d9ded6; --soft:#eceee8;
  --olive:#56731c; --olive-d:#3f5514; --olive-l:#e6eed3; --heat:#b8401f;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Public Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--sans)}
img{max-width:100%;display:block}
a{color:var(--olive-d)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* index column */
.side{position:fixed;inset:0 auto 0 0;width:270px;background:var(--ink);color:#e9eee6;padding:34px 28px;display:flex;flex-direction:column;gap:26px;overflow-y:auto}
.side .who{font:600 1.55rem/1.1 var(--serif);margin:0}
.side .role{font-size:.9rem;color:#b9c4b4;margin:6px 0 0}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:#e9eee6;text-decoration:none;padding:7px 10px;border-radius:6px;display:flex;gap:12px;align-items:baseline;font-size:.95rem}
.side nav a span{font:500 .7rem var(--mono);color:#93a28c;width:18px}
.side nav a:hover,.side nav a.on{background:#25352b}
.lang{display:flex;border:1px solid #3b4d41;border-radius:6px;overflow:hidden;width:max-content}
.lang button{font:500 .78rem var(--mono);padding:6px 12px;border:0;background:transparent;color:#cfd8ca;cursor:pointer}
.lang button[aria-pressed="true"]{background:#c9dc8f;color:var(--ink)}
.side .contact{margin-top:auto;font-size:.82rem;color:#b9c4b4;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.side .cvbtn{background:#c9dc8f;color:var(--ink);border:0;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer;text-align:left}

main{margin-left:270px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:44px}
section{padding-block:64px;border-bottom:1px solid var(--rule);scroll-margin-top:20px}
h2{font:600 2rem/1.15 var(--serif);margin:6px 0 10px;text-wrap:balance}
.lede{max-width:62ch;color:var(--ink2);margin:0}

/* opening plate */
.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:44px;align-items:center;padding-block:56px}
.open h1{font:600 clamp(2.4rem,4.6vw,3.6rem)/1.02 var(--serif);margin:10px 0 16px;letter-spacing:-.01em;text-wrap:balance}
.open p{margin:0 0 14px;max-width:46ch}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--olive-l);color:var(--olive-d);font:600 .78rem var(--sans);padding:6px 12px;border-radius:999px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--olive);display:block}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.facts div{background:var(--sheet);padding:12px 14px}
.facts b{display:block;font:600 1.55rem var(--serif)}
.facts span{font-size:.78rem;color:var(--ink2)}
.cover{position:relative;background:var(--sheet);border:1px solid var(--rule);padding:10px;cursor:zoom-in}
.cover img{width:100%}
.cover figcaption{display:flex;justify-content:space-between;gap:10px;padding:10px 4px 2px;font-size:.82rem;color:var(--ink2)}

/* plates */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}
.filters button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.plate{background:var(--sheet);border:1px solid var(--rule);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;transition:border-color .2s,transform .2s}
.plate:hover{border-color:var(--olive);transform:translateY(-2px)}
.plate.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.plate .pic{aspect-ratio:4/3;background:var(--soft);overflow:hidden;border-bottom:1px solid var(--rule);max-width:100%}
.plate.wide .pic{aspect-ratio:auto;min-height:320px;border-bottom:0;border-right:1px solid var(--rule)}
.plate .pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.plate .txt{padding:20px 22px 22px;display:flex;flex-direction:column;gap:9px;min-width:0}
.plate .top{display:flex;justify-content:space-between;gap:10px}
.plate h3{font:600 1.32rem/1.22 var(--serif);margin:0;text-wrap:balance}
.plate p{margin:0;color:var(--ink2);font-size:.93rem}
.plate .more{margin-top:auto;padding-top:8px;font:600 .85rem var(--sans);color:var(--olive-d)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 .7rem var(--mono);background:var(--soft);padding:3px 8px;border-radius:4px}
.others{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:36px}
.others div{background:var(--sheet);padding:16px 18px}
.others h4{margin:0 0 4px;font:600 1rem var(--serif)}
.others p{margin:0;font-size:.86rem;color:var(--ink2)}

/* skills + path */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 40px;margin-top:24px}
.cols h4{margin:0 0 6px;font:500 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--olive-d)}
.cols p{margin:0}
.tl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 24px;margin-top:24px}
.tl .y{font:500 .78rem var(--mono);color:var(--ink2);padding-top:18px;border-top:1px solid var(--rule)}
.tl .d{padding:14px 0 18px;border-top:1px solid var(--rule)}
.tl h3{margin:0;font:600 1.08rem var(--serif)}
.tl .at{font-size:.88rem;color:var(--olive-d);font-weight:600;margin:2px 0 4px}
.tl p{margin:0;color:var(--ink2);font-size:.92rem}
.end{background:var(--ink);color:#e9eee6;border:0}
.end h2{color:#fff}
.end .lede{color:#c7d0c3}
.end .lines{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.end .lines span{border:1px solid #3b4d41;padding:10px 16px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
footer{padding:18px 44px;font-size:.78rem;color:var(--ink2)}

/* plate viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(14,22,17,.94);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));color:#e9eee6}
.vbar{display:flex;align-items:center;gap:14px;padding-bottom:10px}
.vbar h3{flex:1;min-width:0;margin:0;font:600 1.15rem var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar button{width:40px;height:40px;border-radius:50%;border:1px solid #4a5c50;background:transparent;color:#fff;cursor:pointer;font-size:1rem;flex:none}
.vbar button:hover{background:var(--olive)}
.vbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.vimg{min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.vimg img{max-height:100%;max-width:100%;object-fit:contain;background:#fff}
.vside{overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:.9rem;color:#cfd8ca}
.vside .cap{color:#fff;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs button{padding:0;border:2px solid transparent;background:#fff;cursor:pointer;aspect-ratio:1;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:#c9dc8f}
.thumbs img{width:100%;height:100%;object-fit:cover}
.vside dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.vside dt{font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:#93a28c;padding-top:3px}
.vside dd{margin:0}
.vside a{color:#c9dc8f}
.viewer.cv .vbody{grid-template-columns:minmax(0,1fr)}
.viewer.cv .vimg{align-items:flex-start}
.viewer.cv .vimg img{max-height:none;width:min(100%,900px)}
.cvtabs{display:flex;border:1px solid #4a5c50;border-radius:6px;overflow:hidden}
.cvtabs button{width:auto;height:auto;border-radius:0;border:0;padding:7px 12px;font-size:.8rem}
.cvtabs button[aria-pressed="true"]{background:#c9dc8f;color:var(--ink)}

@media (max-width:980px){

  .side .who{font-size:1.15rem}
  .side nav{flex-direction:row;overflow-x:auto;order:3;width:100%;scrollbar-width:none}
  .side nav a{padding:5px 8px;white-space:nowrap}
  .side nav a span{display:none}
  .side .cvbtn{padding:6px 10px;font-size:.8rem}
  main{margin-left:0}
  .wrap{padding-inline:18px}
  .open{grid-template-columns:minmax(0,1fr);gap:26px}
  .plates{grid-template-columns:minmax(0,1fr)}
  .plate.wide{display:flex}
  .plate.wide .pic{min-height:0;aspect-ratio:4/3;border-right:0;border-bottom:1px solid var(--rule)}
  .others,.cols{grid-template-columns:minmax(0,1fr)}
  .tl{grid-template-columns:minmax(0,1fr)}
  .tl .y{border-top:1px solid var(--rule);padding-top:14px}.tl .d{border-top:0;padding-top:2px}
  .vbody{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .vside{max-height:36vh}
  section{padding-block:44px}
  footer{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

let lang=(location.hash==="#en")?"en":"fr",cat="all",cur=null,ix=0,cvMode=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  $("btn-fr").setAttribute("aria-pressed",lang==="fr"); $("btn-en").setAttribute("aria-pressed",lang==="en");
  $("nav").innerHTML=t.nav.map((n,i)=>`<a href="#${n[0]}" data-go="${n[0]}"><span>0${i+1}</span>${n[1]}</a>`).join("");
  $("facts").innerHTML=t.facts.map(f=>`<div><b>${f[0]}</b><span>${esc(f[1])}</span></div>`).join("");
  $("filters").innerHTML=Object.keys(t.cats).map(k=>`<button type="button" data-c="${k}" aria-pressed="${k===cat}">${t.cats[k]}</button>`).join("");
  $("plates").innerHTML=P.filter(p=>cat==="all"||p.cats.includes(cat)).map(p=>{const x=p[lang];
    return `<button type="button" class="plate${p.wide&&cat==="all"?" wide":""}" data-p="${p.id}">
      <div class="pic"><img src="${p.gal[0].img}" alt="${esc(x.t)}"></div>
      <div class="txt"><div class="top"><span class="mono">${esc(x.k)}</span><span class="mono">${esc(p.when)}</span></div>
      <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p><div class="tags">${x.tags.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
      <span class="more">${t.open} · ${p.gal.length} ${t.figs} →</span></div></button>`}).join("");
  $("others").innerHTML=t.others.map(o=>`<div><h4>${esc(o[0])}</h4><p>${esc(o[1])}</p></div>`).join("");
  $("skills").innerHTML=t.skills.map(s=>`<div><h4>${esc(s[0])}</h4><p>${esc(s[1])}</p></div>`).join("");
  $("tl").innerHTML=t.tl.map(r=>`<div class="y">${esc(r[0])}</div><div class="d"><h3>${esc(r[1])}</h3><div class="at">${esc(r[2])}</div><p>${esc(r[3])}</p></div>`).join("");
  $("foot").textContent=t.foot;
  if(!$("viewer").hidden) draw();
}
function draw(){
  const t=T[lang];
  if(cvMode){ $("vtitle").textContent="CV"; $("vimg").src="img/cv_"+cvMode+".jpg"; $("vimg").alt="CV"; $("vside").innerHTML="";
    document.querySelectorAll("#cvtabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cv===cvMode)); return; }
  const p=cur,x=p[lang],f=p.gal[ix];
  $("vtitle").textContent=x.t; $("vimg").src=f.img; $("vimg").alt=f[lang];
  $("vside").innerHTML=`<p class="cap">${ix+1} / ${p.gal.length} · ${esc(f[lang])}</p>
    ${p.gal.length>1?`<div class="thumbs">${p.gal.map((q,i)=>`<button type="button" data-ix="${i}" aria-current="${i===ix}" aria-label="${esc(q[lang])}"><img src="${q.img}" alt=""></button>`).join("")}</div>`:""}
    <p>${esc(x.d)}</p>
    <dl><dt>${t.lab.place}</dt><dd>${esc(x.place)}</dd><dt>${t.lab.when}</dt><dd>${esc(p.when)}</dd><dt>${t.lab.data}</dt><dd>${esc(x.data)}</dd><dt>${t.lab.tools}</dt><dd>${esc(x.tags.join(", "))}</dd>
    ${p.link?`<dt>${t.lab.link}</dt><dd><a href="${p.link}" target="_blank" rel="noopener noreferrer">Notebook GitHub →</a></dd>`:""}</dl>`;
}
function openP(id,i){cur=P.find(p=>p.id===id);ix=i||0;cvMode=null;$("viewer").classList.remove("cv");$("cvtabs").hidden=true;$("vprev").hidden=$("vnext").hidden=cur.gal.length<2;$("viewer").hidden=false;draw();$("vclose").focus();}
function openCv(v){cvMode=v;$("viewer").classList.add("cv");$("cvtabs").hidden=false;$("vprev").hidden=$("vnext").hidden=true;$("viewer").hidden=false;draw();$("vclose").focus();}
function close(){$("viewer").hidden=true;}
function step(d){if(!cur||cvMode)return;ix=(ix+d+cur.gal.length)%cur.gal.length;draw();}

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){e.preventDefault();const s=$(go.dataset.go);if(s)s.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const pl=e.target.closest("[data-p]"); if(pl){openP(pl.dataset.p);return;}
  const th=e.target.closest("[data-ix]"); if(th){ix=+th.dataset.ix;draw();return;}
  const c=e.target.closest("[data-c]"); if(c){cat=c.dataset.c;render();return;}
  const cv=e.target.closest("[data-cv]"); if(cv){openCv(cv.dataset.cv);return;}
  if(e.target.closest("#cv-open")){openCv("alternance");return;}
  if(e.target.closest("#cover")){openP("icu",0);return;}
  if(e.target.closest("#vclose")||e.target.id==="viewer"){close();return;}
  if(e.target.closest("#vprev"))step(-1); if(e.target.closest("#vnext"))step(1);
});
document.addEventListener("keydown",e=>{if($("viewer").hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);});
$("btn-fr").onclick=()=>{lang="fr";render();}; $("btn-en").onclick=()=>{lang="en";render();};
render();
</script>
